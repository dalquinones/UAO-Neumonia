[project]
name = "uao-neumonia-refactor"
version = "0.2.0"
description = "Proyecto Neumonia con arquitectura MVC, seis modulos, pytest y Docker"
requires-python = ">=3.13,<3.14"
dependencies = [
    "streamlit>=1.45,<2",
    "pillow>=11,<13",
    "numpy>=2,<3",
    "opencv-python-headless>=4.10,<5",
    "pydicom>=3,<4",
    "torch>=2.7,<3",
    "transformers>=4.50,<5",
    "safetensors>=0.4,<1",
]

# CPU: evita la descarga de paquetes CUDA (útil para Windows y Docker).
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = ["pytest>=8,<10", "ruff==0.6.9", "pre-commit>=4,<6"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = ["detector_neumonia.py", ".venv", ".pytest_cache", ".ruff_cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
