[project]
name = "uao-neumonia"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Juan Camilo Perez", email = "kamilo199603@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "numpy<2.3",
    "opencv-python-headless==4.12.0.88",
    "pillow>=13.0.0",
    "pydicom>=3.0.2",
    "streamlit>=1.66.1",
]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-mock>=3.17.0",
    "pre-commit>=4.3.0",
    "ruff>=0.17.1",
]
docker = ["tensorflow-cpu==2.20.0"]

[tool.ruff]
line-length = 100
